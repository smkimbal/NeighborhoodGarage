name: Validate Cloudflare production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run check:cloudflare
        env:
          NG_VALIDATION_BUILD: true
      - name: Install browser for Node 22 walkthrough
        if: matrix.node == 22
        run: npx playwright install --with-deps chromium
      - name: Walk through the production bundle
        if: matrix.node == 22
        env:
          NG_TEST_DIST: dist-production
        run: npm run test:browser
      - name: Validate Cloudflare asset packaging without deploying
        if: matrix.node == 22
        run: npm run deploy -- --dry-run
