name: Deploy GitHub Pages
on:
  push:
    branches: [neighborhood-garage-test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    if: github.ref == 'refs/heads/neighborhood-garage-test'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm test
      - run: npm run check:edge
      - run: npm run build
      - if: matrix.node == 22
        run: npx playwright install --with-deps chromium
      - if: matrix.node == 22
        run: npm run test:browser
        env:
          NG_TEST_DIST: dist
  prepare:
    if: github.ref == 'refs/heads/neighborhood-garage-test'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 7
      - name: Check sandbox hosting settings
        id: pages
        run: node scripts/pages-readiness.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  deploy:
    if: github.ref == 'refs/heads/neighborhood-garage-test' && needs.prepare.outputs.ready == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
