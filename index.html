    <meta property="og:title" content="Neighborhood Garage - Charming Local Tool Sharing &amp; Rentals" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // When hosted statically on GitHub Pages, if the uncompiled root index.html is served,
      // redirect immediately to the pre-compiled /docs/ folder so browsers load the bundled app!
      if (window.location.hostname.includes('github.io')) {
        if (!window.location.pathname.includes('/docs')) {
          var cleanPath = window.location.pathname.replace(/\/$/, '');
          window.location.replace(cleanPath + '/docs/' + window.location.search + window.location.hash);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
